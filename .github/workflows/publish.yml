# Build the course site and publish it to GitHub Pages on every push to main.
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
#
# The pre-render step (_scripts/generate.py) is skipped here
# (COURSE_SKIP_GENERATE=1): the dry-run outputs and graphs it makes are
# committed in _generated/, so CI renders exactly what was reviewed. Snakemake
# is still installed so a maintainer can switch the variable off to rebuild
# them in CI.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COURSE_SKIP_GENERATE: "1"
    steps:
      - name: Check out the course and the pinned pipelines
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Snakemake 8.27.1
        run: |
          python -m pip install --upgrade pip
          python -m pip install "snakemake==8.27.1" pandas pyyaml

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
          tinytex: false

      - name: Render
        run: quarto render

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
