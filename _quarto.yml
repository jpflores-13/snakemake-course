format:
  html:
    theme:
      light: [cosmo, styles/theme.scss]
      dark: [cosmo, styles/theme.scss, styles/theme-dark.scss]
    respect-user-color-scheme: true
    highlight-style:
      light: github
      dark: github-dark
    code-copy: true
    code-overflow: wrap
    code-annotations: below
    code-block-bg: true
    code-block-border-left: true
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    lightbox: auto
    callout-appearance: default
    # lessons also render as reveal.js slides (lessons/_metadata.yml) and the cheat
    # sheet as a PDF; link to those from the page. The trailing "docx" entry only
    # tells Quarto not to add its default links on top of these two.
    format-links:
      - {format: revealjs, text: Slides, icon: easel}
      - {format: typst, text: PDF, icon: file-pdf}
      - docx
    language:
      other-formats-title: "Also as"
