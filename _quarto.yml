project:
  type: website
  output-dir: _site
  # live command output (dry runs, DAGs) -> _generated/; see README.md
  pre-render: _scripts/generate.py
  # only these are pages; everything else (SPEC.md, data/, course-pipeline/,
  # stopping-points/, snakemakeify/, pipelines/, README.md) is left alone
  render:
    - "*.qmd"
    - "lessons/*.qmd"
    - "answers/*.qmd"
    - "exercises/*.qmd"
    - "field-guide/*.qmd"
    - "!SPEC.md"
    - "!README.md"
  resources:
    - "_generated/*.svg"
    - "CITATION.cff"
    - "LICENSE"
    - "LICENSE-code"
    - "envs/course.yml"

execute:
  freeze: auto

lang: en-US

