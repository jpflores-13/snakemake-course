## Conda environment for the Snakemake course (learners' laptops).
## Create it once:   conda env create -f envs/course.yml
## Use it:           conda activate snakemake-course
## Snakemake is pinned to 8.27.1, the version the lab's pipelines pin.
## Tool versions are left open on minor releases so the solver can find builds
## for every platform; see setup.qmd for Apple-silicon notes.
name: snakemake-course
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python =3.12
  - snakemake-minimal =8.27.1
  - pandas
  - pyyaml
  - pytest
  - graphviz
  # alignment, peaks, tracks
  - samtools >=1.20
  - bowtie2 >=2.5
  - macs3 >=3.0
  - bedtools >=2.31
  - deeptools >=3.5.5
  - fastqc >=0.12
  # R and Bioconductor (locus plot)
  - r-base >=4.4
  - bioconductor-plotgardener
  - bioconductor-rtracklayer
  - bioconductor-genomicranges
